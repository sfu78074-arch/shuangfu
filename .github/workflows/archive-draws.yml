name: Draw archive for zodiac learning

on:
  schedule:
    # New Macau Mark Six normally publishes in the evening Macau time.
    # Check every 10 minutes across a broad post-draw window (UTC 13:20-15:50).
    - cron: '20,30,40,50 13 * * *'
    - cron: '0,10,20,30,40,50 14 * * *'
    - cron: '0,10,20,30,40,50 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-draws.yml'
      - 'server/archive-draws.cjs'

permissions:
  contents: write

concurrency:
  group: draw-archive-2026
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch, validate and archive draws
        run: node server/archive-draws.cjs

      - name: Persist draw archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/draw-archive-2026.json data/zodiac-learning-2026.jsonl
          if git diff --cached --quiet; then
            echo 'No new draw to archive.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] Archive latest draw data'
          git pull --rebase origin main
          git push origin HEAD:main
