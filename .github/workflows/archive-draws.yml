name: Draw archive for zodiac learning

on:
  schedule:
    # New Macau Mark Six normally publishes in the evening Macau time.
    # Check every 10 minutes across a broad post-draw window (UTC 13:20-15:50).
    - cron: '20,30,40,50 13 * * *'
    - cron: '0,10,20,30,40,50 14 * * *'
    - cron: '0,10,20,30,40,50 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-draws.yml'
      - 'server/archive-draws.cjs'
      - 'server/build-zodiac-dataset.cjs'
      - 'server/research-zodiac-models.cjs'
      - 'tests/zodiac-dataset.test.cjs'

permissions:
  contents: write

concurrency:
  group: draw-archive-2026
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test archive and feature pipeline
        run: node --test tests/zodiac-dataset.test.cjs

      - name: Fetch, validate and archive draws
        run: node server/archive-draws.cjs

      - name: Detect archive change
        id: archive_change
        shell: bash
        run: |
          if git diff --quiet -- data/draw-archive-2026.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new draw was archived.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'New draw data detected.'
          fi

      - name: Build leakage-safe model datasets
        if: steps.archive_change.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node server/build-zodiac-dataset.cjs

      - name: Run multi-model walk-forward research
        if: steps.archive_change.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node server/research-zodiac-models.cjs

      - name: Persist draw archive and model datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/draw-archive-2026.json \
            data/zodiac-learning-2026.jsonl \
            data/zodiac-features-2026.jsonl \
            data/zodiac-latest-features-2026.json \
            data/zodiac-model-status-2026.json \
            data/zodiac-research-2026.json
          if git diff --cached --quiet; then
            echo 'No archive/model dataset changes.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] Archive draw and rebuild zodiac datasets'
          git pull --rebase origin main
          git push origin HEAD:main
