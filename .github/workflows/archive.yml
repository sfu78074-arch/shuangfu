name: Server prediction archive
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive.yml'
      - 'server/**'
permissions:
  contents: write
concurrency:
  group: server-prediction-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/server.test.cjs
      - name: Fetch and archive first prediction
        run: node server/archive.cjs
      - name: Persist archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/server-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[CF-Pages-Skip] Update server prediction archive'
          git pull --rebase origin main
          git push origin HEAD:main
