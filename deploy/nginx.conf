server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/shuangfu;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/shuangfu-access.log combined;
    error_log  /var/log/nginx/shuangfu-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
