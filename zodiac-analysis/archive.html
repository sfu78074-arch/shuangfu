<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开奖永久存档与遗漏曲线</title><style>
:root{--bg:#07101d;--panel:#0d1a2b;--line:#24364d;--text:#f7fbff;--muted:#8ea2ba;--g:#62e6a8;--y:#ffcc66;--r:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102742,#07101d 55%);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 16px 60px}a{color:inherit}.top,.row,.tools,.zbtns{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.btn,.input,.select{border:1px solid var(--line);background:#0b1727;color:#dce7f5;border-radius:10px;padding:9px 12px}.btn{cursor:pointer;text-decoration:none}.btn:hover{border-color:#4d739f}.panel{margin-top:14px;background:linear-gradient(145deg,#122238dd,#0a1626cc);border:1px solid var(--line);border-radius:18px;padding:18px}.ey{color:var(--g);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:7px 0;font-size:34px}h2{margin:5px 0 13px;font-size:21px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:14px;padding:13px}.card small{color:var(--muted);display:block}.card b{font-size:22px;display:block;margin-top:6px}.ok{color:var(--g)}.bad{color:var(--r)}.scroll{overflow:auto;max-height:650px;margin-top:10px}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #1d2d42;text-align:left;white-space:nowrap;font-size:13px}th{color:var(--muted);font-size:11px;position:sticky;top:0;background:#0c1929}.ball{display:inline-grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--line);border-radius:99px;margin-right:4px}.special{color:var(--y);font-weight:800}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.zbtns button{border:1px solid var(--line);background:#0b1727;color:#b9c8da;border-radius:9px;padding:7px 10px;cursor:pointer}.zbtns button.on{background:var(--g);color:#06111d;border-color:transparent}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.svg{overflow:auto;background:#07101d;border-radius:12px;padding:8px}.svg svg{display:block;width:100%;min-width:760px;height:300px}.hash{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#9fb1c8;margin-top:10px}.status{border:1px solid var(--line);border-radius:999px;padding:8px 12px}@media(max-width:780px){.cards,.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.row{align-items:stretch}.input{min-width:160px}}@media(max-width:480px){.cards,.stats{grid-template-columns:1fr 1fr}h1{font-size:28px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="ey">ARCHIVE + OMISSION HISTORY</div><h1>开奖永久存档与遗漏曲线</h1><div class="muted">读取已经落盘到 GitHub 的永久数据，不使用浏览器临时缓存。</div></div><div class="tools"><a class="btn" href="./">返回主分析页</a><button class="btn" id="refresh">刷新存档</button><span class="status" id="state">读取中…</span></div></div>
<section class="panel"><div class="cards"><div class="card"><small>已存档期数</small><b id="count">—</b></div><div class="card"><small>最新存档期</small><b id="latest">—</b></div><div class="card"><small>最新特码</small><b id="special">—</b></div><div class="card"><small>完整性</small><b id="quality">—</b></div></div><div class="hash" id="hash">—</div></section>
<section class="panel"><h2>存档明细与导出</h2><div class="row"><input class="input" id="q" placeholder="搜索期号/特码"><select class="select" id="z"><option value="">全部生肖</option></select><select class="select" id="size"><option>20</option><option>50</option><option>100</option></select><button class="btn" id="csv">导出当前筛选 CSV</button><button class="btn" id="xls">导出当前筛选 Excel</button><span class="muted" id="meta">—</span></div><div class="scroll"><table><thead><tr><th>期号</th><th>开奖时间</th><th>6个正码</th><th>特码</th><th>生肖</th><th>首次存档</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn" id="prev">上一页</button><span class="muted" id="page">—</span><button class="btn" id="next">下一页</button></div></section>
<section class="panel"><div class="top"><div><div class="ey">OMISSION CURVE</div><h2>12生肖历史遗漏曲线</h2></div><select class="select" id="range"><option value="50">最近50期</option><option value="100" selected>最近100期</option><option value="all">全部存档</option></select></div><div class="zbtns" id="zbtns"></div><div class="stats"><div class="card"><small>当前遗漏</small><b id="cur">—</b></div><div class="card"><small>历史最大遗漏</small><b id="max">—</b></div><div class="card"><small>最后开出期号</small><b id="last">—</b></div><div class="card"><small>曲线区间</small><b id="sample">—</b></div></div><div class="svg" id="svg"></div><div class="muted" style="margin-top:8px">黄点表示该期实际开出当前选择的生肖；曲线值表示每期开奖结束后已经连续未开多少期。</div></section></div><script>
const Z=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'],T={龍:'龙',馬:'马',雞:'鸡',豬:'猪'},$=i=>document.getElementById(i);let A=null,page=1,cz='龙';const zn=x=>T[x]||x,fmt=v=>{if(!v)return'—';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch{return String(v)}};
function quality(){if(!A?.draws?.length)return false;const p=A.draws.map(d=>+d.period);if(new Set(p).size!==p.length)return false;for(let i=1;i<p.length;i++)if(p[i]!==p[i-1]+1)return false;return true}
function filtered(){const q=$('q').value.trim(),z=$('z').value;return A.draws.slice().reverse().filter(d=>(!q||String(d.expect).includes(q)||String(d.special).padStart(2,'0')===q)&&(!z||zn(d.specialZodiac)===z))}
function render(){if(!A)return;const d=A.draws,l=d.at(-1);$('count').textContent=(A.count||d.length)+'期';$('latest').textContent=A.latestExpect||l.expect;$('special').textContent=zn(l.specialZodiac)+' · '+String(l.special).padStart(2,'0');$('quality').textContent=quality()?'完整':'需检查';$('quality').className=quality()?'ok':'bad';$('hash').textContent='Archive SHA256: '+(A.sha256||'—');$('meta').textContent=`首次建档 ${fmt(A.createdAt)} · 最近落盘 ${fmt(l.archivedAt||A.checkedAt)}`;const f=filtered(),n=+$('size').value||20,pages=Math.max(1,Math.ceil(f.length/n));page=Math.min(Math.max(1,page),pages);$('rows').innerHTML=f.slice((page-1)*n,page*n).map(x=>`<tr><td><b>${x.expect}</b></td><td>${x.openTimeLocal||fmt(x.openTime)}</td><td>${(x.regular||[]).map(v=>`<span class="ball">${String(v).padStart(2,'0')}</span>`).join('')}</td><td class="special">${String(x.special).padStart(2,'0')}</td><td><b>${zn(x.specialZodiac)}</b></td><td>${fmt(x.archivedAt)}</td></tr>`).join('')||'<tr><td colspan="6">没有符合条件的记录</td></tr>';$('page').textContent=`第 ${page}/${pages} 页 · ${f.length}期`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;chart()}
function dl(name,type,text){const a=document.createElement('a'),b=new Blob([text],{type});a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
function c(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
function exportCsv(){const f=filtered();if(!f.length)return alert('没有可导出的记录');const h=['期号','开奖时间','正码1','正码2','正码3','正码4','正码5','正码6','特码','特码生肖','7个生肖','波色','首次存档时间'];const r=f.slice().reverse().map(d=>[d.expect,d.openTimeLocal||d.openTime,...(d.regular||[]),d.special,zn(d.specialZodiac),(d.zodiac||[]).map(zn).join('|'),(d.wave||[]).join('|'),d.archivedAt||''].map(c).join(','));dl(`开奖生肖存档_${f.length}期.csv`,'text/csv;charset=utf-8','\ufeff'+[h.join(','),...r].join('\r\n'))}
function e(v){return String(v??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function exportXls(){const f=filtered();if(!f.length)return alert('没有可导出的记录');const h=['期号','开奖时间','正码1','正码2','正码3','正码4','正码5','正码6','特码','特码生肖','7个生肖','波色','首次存档时间'];const trs=f.slice().reverse().map(d=>{const v=[d.expect,d.openTimeLocal||d.openTime,...(d.regular||[]),d.special,zn(d.specialZodiac),(d.zodiac||[]).map(zn).join('、'),(d.wave||[]).join('、'),d.archivedAt||''];return '<tr>'+v.map(x=>`<td>${e(x)}</td>`).join('')+'</tr>'}).join('');dl(`开奖生肖存档_${f.length}期.xls`,'application/vnd.ms-excel;charset=utf-8','\ufeff'+`<html><head><meta charset="utf-8"></head><body><table border="1"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${trs}</table></body></html>`)}
function series(z){let m=0;return A.draws.map(d=>{const hit=zn(d.specialZodiac)===z;m=hit?0:m+1;return{expect:d.expect,m,hit}})}
function chart(){if(!A)return;const raw=series(cz),rv=$('range').value,s=rv==='all'?raw:raw.slice(-+rv),mx=Math.max(1,...s.map(x=>x.m)),w=1000,h=270,L=46,R=15,Tp=16,B=34,iw=w-L-R,ih=h-Tp-B,x=i=>L+(s.length<=1?0:i/(s.length-1)*iw),y=v=>Tp+ih-v/mx*ih;let g='';for(let k=0;k<=4;k++){const v=Math.round(mx*k/4),yy=y(v);g+=`<line x1="${L}" y1="${yy}" x2="${w-R}" y2="${yy}" stroke="#203149"/><text x="8" y="${yy+4}" fill="#8194ab" font-size="11">${v}</text>`}const p=s.map((d,i)=>`${x(i)},${y(d.m)}`).join(' '),dots=s.map((d,i)=>d.hit?`<circle cx="${x(i)}" cy="${y(d.m)}" r="3" fill="#ffcc66"><title>${d.expect} 开出${cz}</title></circle>`:'').join(''),idx=[0,Math.floor((s.length-1)/2),s.length-1].filter((v,i,a)=>v>=0&&a.indexOf(v)===i),lab=idx.map(i=>`<text x="${x(i)}" y="${h-9}" fill="#8194ab" font-size="11" text-anchor="${i===0?'start':i===s.length-1?'end':'middle'}">${s[i]?.expect||''}</text>`).join('');$('svg').innerHTML=`<svg viewBox="0 0 ${w} ${h}">${g}<polyline fill="none" stroke="#62e6a8" stroke-width="2.5" points="${p}"/>${dots}${lab}</svg>`;$('cur').textContent=(raw.at(-1)?.m??0)+'期';$('max').textContent=Math.max(0,...raw.map(x=>x.m))+'期';$('last').textContent=[...raw].reverse().find(x=>x.hit)?.expect||'—';$('sample').textContent=s.length?`${s[0].expect}–${s.at(-1).expect}`:'—';[...$('zbtns').children].forEach(b=>b.classList.toggle('on',b.dataset.z===cz))}
async function load(){try{$('state').textContent='读取中…';const r=await fetch('/api/archive?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);A=await r.json();if(!Array.isArray(A.draws))throw Error('格式异常');render();$('state').textContent='已读取 '+(A.latestExpect||'—');$('state').className='status ok'}catch(err){$('state').textContent='读取失败：'+err.message;$('state').className='status bad'}}
Z.forEach(z=>{let o=document.createElement('option');o.value=o.textContent=z;$('z').appendChild(o);let b=document.createElement('button');b.textContent=z;b.dataset.z=z;b.onclick=()=>{cz=z;chart()};$('zbtns').appendChild(b)});$('refresh').onclick=load;$('q').oninput=()=>{page=1;render()};$('z').onchange=()=>{page=1;render()};$('size').onchange=()=>{page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('csv').onclick=exportCsv;$('xls').onclick=exportXls;$('range').onchange=chart;load();
</script></body></html>
