<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生肖模型数据状态</title><style>:root{--bg:#07101d;--p:#0e1b2e;--line:#22334a;--text:#f7fbff;--muted:#8ea2ba;--g:#62e6a8;--b:#59a8ff;--y:#ffcc66;--r:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102742 0,#07101d 55%);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 16px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.ey{color:var(--g);font-size:12px;letter-spacing:.13em;font-weight:800}h1{font-size:38px;margin:8px 0}h2{font-size:20px;margin:4px 0 14px}.muted{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:linear-gradient(145deg,#122238dd,#0a1626cc);border:1px solid var(--line);border-radius:18px}.card{padding:17px}.card span{display:block;color:var(--muted);font-size:12px}.card b{display:block;font-size:27px;margin-top:10px}.panel{padding:20px;margin-top:12px}.ok{color:var(--g)}.bad{color:var(--r)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid #1d2e43;text-align:left;font-size:13px}th{color:var(--muted);font-size:11px}.scroll{overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cand{font-size:30px;font-weight:850;line-height:1.5}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.z{border:1px solid var(--line);border-radius:12px;padding:11px}.z b{font-size:18px}.z small{display:block;color:var(--muted);margin-top:4px}.warn{border-left:3px solid var(--y);background:#ffcc6610;padding:10px 12px;color:#bdc9d8;font-size:12px;margin-top:14px}a{color:#8fc6ff}.btn{border:1px solid var(--line);background:#0b1727;color:#fff;padding:9px 13px;border-radius:10px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero{flex-direction:column}.rows{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><div><div class="ey">ARCHIVE / MODEL HEALTH</div><h1>生肖模型数据状态</h1><div class="muted">查看自动存档、数据完整性、下一期特征与滚动回测状态。</div></div><div><button class="btn" onclick="load()">刷新状态</button> <a class="pill" href="./">返回主看板</a></div></div><div class="grid"><div class="card"><span>存档期数</span><b id="count">—</b></div><div class="card"><span>最新已归档</span><b id="latest">—</b></div><div class="card"><span>下一目标期</span><b id="next">—</b></div><div class="card"><span>数据健康</span><b id="health">—</b></div></div><div class="two"><section class="panel"><div class="ey">NEXT SNAPSHOT</div><h2>下一期候选</h2><div id="cands"></div></section><section class="panel"><div class="ey">CURRENT RANK</div><h2>当前生肖特征排行</h2><div class="rows" id="ranks"></div></section></div><section class="panel"><div class="ey">WALK-FORWARD</div><h2>严格按时间顺序回测</h2><div class="scroll"><table><thead><tr><th>选肖数</th><th>测试期数</th><th>命中</th><th>命中率</th><th>理论基准</th><th>差值</th><th>近30期</th><th>最大连未中</th></tr></thead><tbody id="bt"></tbody></table></div><div class="warn">训练特征仅使用目标期开奖前的数据；target 与 candidateHits 只用于标签/评估，不能作为模型输入。</div></section><section class="panel"><div class="ey">INTEGRITY</div><h2>归档完整性</h2><div id="integrity" class="muted">加载中…</div></section></div><script>const pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'—';async function load(){try{const r=await fetch('/data/zodiac-model-status-2026.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json(),a=s.archive,n=s.next,q=a.quality;count.textContent=a.count;latest.textContent=a.latestExpect;next.textContent=n.targetExpect;health.textContent=q.ok?'正常':'异常';health.className=q.ok?'ok':'bad';cands.innerHTML=Object.entries(n.candidates).map(([k,v])=>`<div><span class="muted">${k}肖</span><div class="cand">${v.join(' · ')}</div></div>`).join('');ranks.innerHTML=n.ranked.map((x,i)=>`<div class="z"><b>#${i+1} ${x.zodiac}</b><small>遗漏 ${x.omission}期 · 分数 ${x.score} · ${x.numberCount}个号码</small></div>`).join('');bt.innerHTML=s.walkForwardBacktest.map(x=>`<tr><td>${x.n}肖</td><td>${x.tested}</td><td>${x.hits}</td><td><b>${pct(x.hitRate)}</b></td><td>${pct(x.theoreticalBaseline)}</td><td class="${x.edge>=0?'ok':'bad'}">${x.edge>=0?'+':''}${pct(x.edge)}</td><td>${pct(x.recent30)}</td><td>${x.maxConsecutiveMisses}期</td></tr>`).join('');integrity.innerHTML=`缺期：${q.missing.length?q.missing.join('、'):'无'}<br>重复期：${q.duplicates.length?q.duplicates.join('、'):'无'}<br>异常生肖：${q.invalidZodiac.length?q.invalidZodiac.join('、'):'无'}<br>异常号码：${q.invalidNumbers.length?q.invalidNumbers.join('、'):'无'}<br>最后构建：${s.builtAt}<br>源数据SHA：${a.sourceSha256||'—'}`;}catch(e){health.textContent='读取失败';health.className='bad';integrity.textContent=e.message}}load();</script></body></html>
