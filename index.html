<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    connect-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self' data:;
    object-src 'none';
    base-uri 'none';
    form-action 'self';
    upgrade-insecure-requests">

  <title>808 S4.6</title>

  <style>
    body{
      margin:0;
      background:#0b1220;
      color:#fff;
      font-family:-apple-system,system-ui,sans-serif;
      display:grid;
      place-items:center;
      min-height:100vh
    }

    .box{
      text-align:center;
      padding:24px
    }

    small{
      color:#9aa8bd
    }
  </style>
</head>

<body>

<div class="box">
  <b>808 S4.6 正在加载…</b>
  <br>
  <small>S4.5六肖保持锁定；S4.6数字增强层从246期开始独立盲测</small>
</div>

<script>
(async()=>{

  try{

    /* ===== 当前版本 ===== */
    window.__S44_BUILD='v62';


    /* ===== 读取 S3 历史主体 ===== */
    let b64='';

    for(let i=0;i<5;i++){
      b64 += await (
        await fetch('./p'+i+'.txt?v=62')
      ).text();
    }


    const bin=atob(b64.trim());

    const u=new Uint8Array(bin.length);

    for(let i=0;i<bin.length;i++){
      u[i]=bin.charCodeAt(i);
    }


    let html;


    /* ===== 解压主体 ===== */
    if('DecompressionStream' in window){

      const ds=new DecompressionStream('gzip');

      html=await new Response(
        new Blob([u]).stream().pipeThrough(ds)
      ).text();

    }else{

      await new Promise((ok,fail)=>{

        const s=document.createElement('script');

        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';

        s.onload=ok;
        s.onerror=fail;

        document.head.appendChild(s);

      });

      html=new TextDecoder().decode(
        window.pako.ungzip(u)
      );
    }



    /* ===== 修正第245期内置数据 ===== */
    const mark='const BUILTIN = ';

    const a=html.indexOf(mark);

    if(a>=0){

      const b=html.indexOf(';',a);

      if(b>a){

        try{

          let arr=JSON.parse(
            html.slice(
              a+mark.length,
              b
            )
          );


          arr=arr.filter(
            x=>x.period!==245
          );


          arr.push({
            period:245,
            regular:[
              22,
              23,
              14,
              2,
              13,
              38
            ],
            special:18
          });


          arr.sort(
            (x,y)=>x.period-y.period
          );


          html=
            html.slice(
              0,
              a+mark.length
            )
            +
            JSON.stringify(arr)
            +
            html.slice(b);


        }catch(_){}

      }

    }



    /* ===== 安全页面设置 ===== */
    const sec=
      '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">'
      +
      '<meta name="referrer" content="no-referrer">'
      +
      '<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' \'unsafe-inline\' https://cdn.jsdelivr.net; connect-src \'self\' https://cdn.jsdelivr.net; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data:; font-src \'self\' data:; object-src \'none\'; base-uri \'none\'; form-action \'self\'; upgrade-insecure-requests">';


    html=html.replace(
      /<head([^>]*)>/i,
      '<head$1>'+sec
    );



    /* ===== 本地数据版本 ===== */
    html=html.replaceAll(
      'standalone_s3_draws_v1',
      'standalone_s3_draws_v2'
    );



    /* ===== 网页标题 ===== */
    html=html.replace(
      /<title>[^<]*<\/title>/i,
      '<title>808 S4.6</title>'
    );



    /* ===== 加载 S4 系列模块 ===== */

    let core=await (
      await fetch('./s42.js?v=62')
    ).text();


    core=core.replace(
      'setTimeout(render,450);setInterval(watch,1800);',
      ''
    );


    const addon43=await (
      await fetch('./s43.js?v=62')
    ).text();


    const addonState=await (
      await fetch('./s44state.js?v=62')
    ).text();


    const addon44=await (
      await fetch('./s44simple.js?v=62')
    ).text();


    const addon45=await (
      await fetch('./s45.js?v=62')
    ).text();


    const addon46=await (
      await fetch('./s46.js?v=62')
    ).text();


    const addonM=await (
      await fetch('./runtime-migrate.js?v=62')
    ).text();


    const addonTitle=await (
      await fetch('./title808.js?v=62')
    ).text();



    /* ===== 注入 S4.3 / S4.4 / S4.5 / S4.6 ===== */
    const cj=core.lastIndexOf('})();');

    if(cj<0){
      throw new Error(
        '找不到S4核心结束位置'
      );
    }


    core=
      core.slice(0,cj)
      +
      '\n'
      +
      addon43
      +
      '\n'
      +
      addonState
      +
      '\n'
      +
      addon44
      +
      '\n'
      +
      addon45
      +
      '\n'
      +
      addon46
      +
      '\n'
      +
      addonM
      +
      '\n'
      +
      addonTitle
      +
      '\n'
      +
      core.slice(cj);



    /* ===== 注入到 S3 主体 ===== */
    const cut=html.lastIndexOf('})();');

    if(cut<0){
      throw new Error(
        '找不到S3计算核心结束位置'
      );
    }


    html=
      html.slice(0,cut)
      +
      '\n'
      +
      core
      +
      '\n'
      +
      html.slice(cut);



    /* ===== 打开最终页面 ===== */
    document.open();

    document.write(html);

    document.close();



  }catch(e){

    document.body.innerHTML=
      '<div class="box">'
      +
      '<b>加载失败</b>'
      +
      '<br>'
      +
      '<small>'
      +
      e.message
      +
      '</small>'
      +
      '</div>';

  }

})();
</script>

</body>
</html>
