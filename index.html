<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>盘口S3</title><style>body{margin:0;background:#0b1220;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}small{color:#9aa8bd}</style></head><body><div class="box"><b>盘口 S3 正在加载…</b><br><small>正在载入245期并计算246期</small></div><script>
(async()=>{try{let b64='';for(let i=0;i<5;i++)b64+=await (await fetch('./p'+i+'.txt?2')).text();const bin=atob(b64.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);let html;if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();}else{await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});html=new TextDecoder().decode(window.pako.ungzip(u));}
// 245期正式结果：只追加开奖数据，不修改S3模型规则
const mark='const BUILTIN = ';const a=html.indexOf(mark);if(a>=0){const b=html.indexOf(';',a);if(b>a){try{let arr=JSON.parse(html.slice(a+mark.length,b));arr=arr.filter(x=>x.period!==245);arr.push({period:245,regular:[22,23,14,2,13,38],special:18});arr.sort((x,y)=>x.period-y.period);html=html.slice(0,a+mark.length)+JSON.stringify(arr)+html.slice(b);}catch(_){}}}
// 使用新的本地开奖数据版本，避免旧的1-244缓存覆盖245期
html=html.replaceAll('standalone_s3_draws_v1','standalone_s3_draws_v2');
// 在页面原有S3函数加载完成后，补算当时锁定的245候选模型日志，再按原规则计算246
const boot=`<script>setTimeout(()=>{try{if(typeof BUILTIN!=='undefined'&&typeof modelLog50!=='undefined'&&typeof linearRank==='function'){if(!modelLog50[245]||!modelLogS2[245]){const h=BUILTIN.filter(r=>r.period<245),c=new Map(),r50=linearRank(h,245,50,c),r100=linearRank(h,245,100,c),rs2=blendRanks(r50,r100);modelLog50[245]=r50.slice(0,9);modelLogS2[245]=rs2.slice(0,9);localStorage.setItem('s3_model50_v1',JSON.stringify(modelLog50));localStorage.setItem('s3_models2_v1',JSON.stringify(modelLogS2));}if(typeof refresh==='function')refresh(245);if(typeof runPredict==='function')runPredict();}}catch(e){console.log(e)}},300);<\/script>`;
html=html.replace('</body>',boot+'</body>');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><b>加载失败</b><br><small>'+e.message+'</small></div>'}})();
</script></body></html>
