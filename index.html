<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>盘口S3</title><style>body{margin:0;background:#0b1220;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}small{color:#9aa8bd}</style></head><body><div class="box"><b>盘口 S3 正在加载…</b><br><small>首次打开需要几秒钟</small></div><script>
(async()=>{try{let b64='';for(let i=0;i<5;i++)b64+=await (await fetch('./p'+i+'.txt?1')).text();const bin=atob(b64.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);let html;if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();}else{await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});html=new TextDecoder().decode(window.pako.ungzip(u));}document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><b>加载失败</b><br><small>'+e.message+'</small></div>'}})();
</script></body></html>
