<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>盘口S4.2</title><style>body{margin:0;background:#0b1220;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}small{color:#9aa8bd}</style></head><body><div class="box"><b>盘口 S4.2 正在加载…</b><br><small>载入历史数据并计算最新一期</small></div><script>
(async()=>{try{let b64='';for(let i=0;i<5;i++)b64+=await (await fetch('./p'+i+'.txt?v=42')).text();const bin=atob(b64.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);let html;if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();}else{await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});html=new TextDecoder().decode(window.pako.ungzip(u));}
const mark='const BUILTIN = ';const a=html.indexOf(mark);if(a>=0){const b=html.indexOf(';',a);if(b>a){try{let arr=JSON.parse(html.slice(a+mark.length,b));arr=arr.filter(x=>x.period!==245);arr.push({period:245,regular:[22,23,14,2,13,38],special:18});arr.sort((x,y)=>x.period-y.period);html=html.slice(0,a+mark.length)+JSON.stringify(arr)+html.slice(b);}catch(_){}}}
html=html.replaceAll('standalone_s3_draws_v1','standalone_s3_draws_v2');html=html.replace(/<title>[^<]*<\/title>/i,'<title>盘口 S4.2</title>');html=html.replace('</body>','<script src="./s42.js?v=42"><\/script></body>');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><b>加载失败</b><br><small>'+e.message+'</small></div>'}})();
</script></body></html>
